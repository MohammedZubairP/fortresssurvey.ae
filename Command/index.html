*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a;min-height:100vh}
input,select,textarea,button{font-family:inherit}
:root{
--bg1:#ffffff;--bg2:#f5f5f3;--bg3:#ebebea;
--tx1:#1a1a1a;--tx2:#6b6b6b;--tx3:#a0a0a0;
--txI:#185fa5;--txS:#3b6d11;--txW:#854f0b;--txD:#a32d2d;
--bgI:#e6f1fb;--bgS:#eaf3de;--bgW:#faeeda;--bgD:#fcebeb;

--rm:8px;--rl:12px;
--brand:#8a5323;--brandBg:#f3e8da;--brandBd:#c99a63
}

body{background:#1a1a1a;color:#e8e8e6}

}
input,select,textarea{background:var(--bg1);color:var(--tx1);border:0.5px solid var(--bdm);border-radius:var(--rm);padding:8px 11px;font-size:13px;width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
button{cursor:pointer}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--bdm);border-radius:3px}
.inline-edit{cursor:pointer;border-radius:4px;padding:1px 3px;margin:-1px -3px;transition:background .15s}
.inline-edit:hover{background:var(--bg3)}

const CEMAIL='admin@fortresssurvey.ae';
const DPASS='Fortress@2026';
function getPass(){try{return localStorage.getItem('ftc:pass')||DPASS;}catch{return DPASS;}}
function setPass(p){try{localStorage.setItem('ftc:pass',p);}catch{}}
function ld(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}}
function sv(k,d){try{localStorage.setItem(k,JSON.stringify(d));}catch{}}
function getEcfg(){try{const v=localStorage.getItem('ftc:ecfg');return v?JSON.parse(v):null;}catch{return null;}}
function saveEcfg(c){try{localStorage.setItem('ftc:ecfg',JSON.stringify(c));}catch{}}
async function ftcNotify(subject,body){
  const c=getEcfg();
  if(!c||!c.key||c.on===false)return;
  try{
    await fetch('https://api.web3forms.com/submit',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({access_key:c.key,subject:'[Fortress Command] '+subject,message:body+'\n\nTime: '+new Date().toLocaleString('en-AE'),from_name:'Fortress Command',replyto:'admin@fortresssurvey.ae'})
    });
  }catch(e){}
}

function IE({value,onSave,type='text',opts,style:st={}}){
  const [editing,setEditing]=useState(false);
  const [v,setV]=useState(value);
  const ref=useRef();
  useEffect(()=>{if(editing&&ref.current)ref.current.focus();},[editing]);
  if(editing){
    const finish=()=>{onSave(v);setEditing(false);};
    if(opts)return h('select',{value:v,onChange:e=>setV(e.target.value),onBlur:finish,ref,style:{fontSize:'inherit',padding:'1px 4px',borderRadius:4,border:'1px solid var(--brand)',background:'var(--bg1)',color:'var(--tx1)'}},opts.map(o=>h('option',{key:typeof o==='object'?o.v:o,value:typeof o==='object'?o.v:o},typeof o==='object'?o.l:o)));
    return h('input',{ref,type,value:v,onChange:e=>setV(e.target.value),onBlur:finish,onKeyDown:e=>{if(e.key==='Enter')finish();if(e.key==='Escape'){setV(value);setEditing(false);}},style:{fontSize:'inherit',padding:'1px 4px',borderRadius:4,border:'1px solid var(--brand)',background:'var(--bg1)',color:'var(--tx1)',width:'100%',...st}});
  }
  return h('span',{className:'inline-edit',onClick:()=>{setV(value);setEditing(true);},title:'Click to edit',style:st},value===0?'0':(value||h('span',{style:{color:'var(--tx3)',fontStyle:'italic'}},'—')));
}
function toCSV(rows){return rows.map(r=>r.map(c=>{const s=String(c==null?'':c);return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\n');}
function dlCSV(filename,rows){const blob=new Blob([toCSV(rows)],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();}
function dlJSON(filename,data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();}

  const subtotal=rows.reduce((s,r)=>s+r.amount,0);
  const vat=includeVat?subtotal*(Number(vatPct)||0)/100:0;
  const discAmt=discountType==='%'?subtotal*(Number(discount)||0)/100:(Number(discount)||0);
  const total=subtotal+vat-discAmt;
  return{rows,subtotal,vat,discAmt,total};
}

function WysiwygEditor({buildBody,draft,setDraft,resetToken}){
  const rootRef=useRef();
  const pageRef=useRef();
  useEffect(()=>{
    const root=rootRef.current;
    if(!root)return;
    const page=root.querySelector('.page-surface');
    if(!page)return;
    pageRef.current=page;
    page.innerHTML=draft.customBodyHtml||buildBody({...draft,editable:true});
    page.setAttribute('contenteditable','true');
    page.setAttribute('spellcheck','false');

    let saveTimer=null;
    const scheduleSave=()=>{
      clearTimeout(saveTimer);
      saveTimer=setTimeout(()=>{
        setDraft(d=>({...d,customBodyHtml:page.innerHTML}));
      },400);
    };
    const onInput=()=>scheduleSave();

    const onResizeDown=e=>{
      const handle=e.target.closest&&e.target.closest('.rs-handle');
      if(!handle||!page.contains(handle))return;
      e.preventDefault();e.stopPropagation();
      const key=handle.dataset.rs;
      const holder=handle.parentElement;
      const img=holder.querySelector('img');
      if(!img)return;
      const startX=(e.touches?e.touches[0].clientX:e.clientX);
      const startWidth=img.getBoundingClientRect().width;
      const pageRect=page.getBoundingClientRect();
      const mmPerPx=182/pageRect.width;
      let newSizeMm=null;
      const move=ev=>{
        const pt=ev.touches?ev.touches[0]:ev;
        const deltaPx=pt.clientX-startX;
        const newWidthPx=Math.max(15,startWidth+deltaPx);
        newSizeMm=Math.round(newWidthPx*mmPerPx*10)/10;
        img.style.width=newSizeMm+'mm';
      };
      const up=()=>{
        document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);
        document.removeEventListener('touchmove',move);document.removeEventListener('touchend',up);
        if(newSizeMm)scheduleSave();
      };
      document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
      document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',up);
    };

    const onDragDown=e=>{
      if(e.target.closest&&e.target.closest('.rs-handle'))return;
      const wrap=e.target.closest&&e.target.closest('[data-drag]');
      if(!wrap||!page.contains(wrap))return;
      e.preventDefault();
      const move=ev=>{
        const rect=page.getBoundingClientRect();
        const pt=ev.touches?ev.touches[0]:ev;
        let x=((pt.clientX-rect.left)/rect.width)*100;
        let y=((pt.clientY-rect.top)/rect.height)*100;
        x=Math.max(0,Math.min(95,Math.round(x*10)/10));
        y=Math.max(0,Math.min(95,Math.round(y*10)/10));
        wrap.style.left=x+'%';wrap.style.top=y+'%';
      };
      const up=()=>{
        document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);
        document.removeEventListener('touchmove',move);document.removeEventListener('touchend',up);
        scheduleSave();
      };
      document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
      document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',up);
    };

    page.addEventListener('input',onInput);
    page.addEventListener('mousedown',onResizeDown,true);
    page.addEventListener('touchstart',onResizeDown,true);
    page.addEventListener('mousedown',onDragDown);
    page.addEventListener('touchstart',onDragDown,{passive:false});
    return()=>{
      clearTimeout(saveTimer);
      page.removeEventListener('input',onInput);
      page.removeEventListener('mousedown',onResizeDown,true);
      page.removeEventListener('touchstart',onResizeDown,true);
      page.removeEventListener('mousedown',onDragDown);
      page.removeEventListener('touchstart',onDragDown);
    };
    // eslint-disable-next-line
  },[resetToken]);
  const pageCss=PRINT_BASE_CSS.replace('body{','.page-surface{')+`
.page-surface{outline:none}
.page-surface [data-drag]{cursor:grab}
`;

    h('div',{style:{...C.card,marginBottom:8,fontSize:11,color:'var(--tx2)',padding:'8px 12px'}},'Click anywhere to type — add, edit or delete any text, just like a Word document. Drag the stamp, signatures or photo to move them; drag their corner handle to resize.'),
    h('div',{style:{...C.card,padding:0,overflow:'auto',background:'#e5e5e2'}},
      h('div',{style:{padding:'16px',display:'flex',justifyContent:'center'}},
        h('div',{style:{width:'210mm',flexShrink:0}},
          h('style',null,pageCss),
          h('div',{className:'page-surface',style:{background:'#fff',boxShadow:'0 1px 6px rgba(0,0,0,0.15)',cursor:'text'}})
        )
      )

  );

function DocumentsSection({docs,saveDocs,counters,saveCounters}){
  const [tab,setTab]=useState('quotation');
  const [qStep,setQStep]=useState('form');const[qDraft,setQDraft]=useDraft('ftc:draftQuotation',{});
  const [iStep,setIStep]=useState('form');const[iDraft,setIDraft]=useDraft('ftc:draftInvoice',{});
  const [cStep,setCStep]=useState('form');const[cDraft,setCDraft]=useDraft('ftc:draftCertificate',{});
  const [viewDoc,setViewDoc]=useState(null);
  const finalize=(type,draft,resetDraft,setStep)=>{
    const prefix=type==='Quotation'?'FSE-QTN':type==='Invoice'?'FSE-INV':'FMC';
    const{n}=nextRefNo(prefix,counters);
    const rec={id:uid(),type,createdAt:new Date().toISOString(),data:draft};
    saveDocs([...docs,rec]);
    saveCounters({...counters,[prefix]:n});

    printDocHTML(html,type+'-'+draft.refNo);

    tab==='invoice'&&(iStep==='form'?h(QIForm,{kind:'Invoice',draft:iDraft,setDraft:setIDraft,onReview:()=>setIStep('review'),counters}):h(QIReview,{kind:'Invoice',draft:iDraft,setDraft:setIDraft,counters,onBack:()=>setIStep('form'),onConfirm:()=>finalize('Invoice',iDraft,setIDraft,setIStep)})),
    tab==='certificate'&&(cStep==='form'?h(CertForm,{draft:cDraft,setDraft:setCDraft,onReview:()=>setCStep('review'),counters}):h(CertReview,{draft:cDraft,setDraft:setCDraft,counters,onBack:()=>setCStep('form'),onConfirm:()=>finalize('Certificate',cDraft,setCDraft,setCStep)})),
    tab==='history'&&h(HistoryList,{docs,onReprint:dd=>{const html=dd.type==='Certificate'?buildCertHTML(dd.data):buildQIHTML(dd.type,dd.data);printDocHTML(html,dd.type+'-'+dd.data.refNo);},onDelete:id=>saveDocs(docs.filter(d=>d.id!==id)),onDuplicate:dd=>{if(dd.type==='Quotation'){setQDraft({...dd.data,refNo:''});setTab('quotation');setQStep('form');}else if(dd.type==='Invoice'){setIDraft({...dd.data,refNo:''});setTab('invoice');setIStep('form');}else{setCDraft({...dd.data,refNo:''});setTab('certificate');setCStep('form');}}})
  );
}
